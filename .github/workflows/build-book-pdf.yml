name: Build Persian Book PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "translations/kotlovan-fa-v2.txt"
      - "translations/kotlovan-fa-v2-pages-*.txt"
      - "scripts/build_book_pdf.py"
      - ".github/workflows/build-book-pdf.yml"

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Persian PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip fonts-noto-core fonts-noto-extra fonts-dejavu
          python3 -m pip install --upgrade pip
          python3 -m pip install reportlab arabic-reshaper python-bidi

      - name: Build PDF
        run: python3 scripts/build_book_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlovan-fa-v2-pdf
          path: dist/kotlovan-fa-v2.pdf
          if-no-files-found: error
