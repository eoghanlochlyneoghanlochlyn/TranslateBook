name: Build Persian PDF

on:
  push:
    paths:
      - 'translations/kotlovan-fa.txt'
      - '.github/workflows/build-pdf.yml'
      - 'scripts/build_kotlovan_pdf.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab arabic-reshaper python-bidi

      - name: Download Persian font
        run: |
          mkdir -p fonts
          curl -L --fail --retry 3 -o fonts/NotoNaskhArabic-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf

      - name: Build PDF
        run: python scripts/build_kotlovan_pdf.py

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/kotlovan-fa.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Build Persian PDF of Kotlovan"
            git push
          fi
